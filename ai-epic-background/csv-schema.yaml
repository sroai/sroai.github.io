  lambda_acceptance:
    row: one event, with the Λ → p π⁻ acceptance ledger
    needs: reco
    keys: [evt]
    columns:
      evt:               entry number in the input file; joins every file of one input
      lam_decay:         Λ decay type — 0 no daughters, 1 p π⁻, 2 n π⁰, 3 more than two daughters, 4 only p, 5 only π⁺, 6 only n, 7 only π⁰, 8 other; -1 without a Λ
      n_lambdas:         Λs in MCParticles
      lam_mom:           momentum of the first Λ [GeV/c]
      lam_eta:           pseudorapidity of the first Λ
      lam_decay_pos_z:   decay point z (the proton's production vertex), 0 without a proton [mm]
      prot_mom:          momentum of the proton from the Λ [GeV/c]
      prot_theta:        polar angle of the proton from the Λ [rad]
      prot_eta:          pseudorapidity of the proton from the Λ
      pimin_mom:         momentum of the π⁻ from the Λ [GeV/c]
      pimin_theta:       polar angle of the π⁻ from the Λ [rad]
      pimin_eta:         pseudorapidity of the π⁻ from the Λ
      prot_n_hits_b0:    raw hits of the proton in the B0 tracker
      prot_n_hits_rp:    raw hits of the proton in the Roman Pots
      prot_n_hits_offm:  raw hits of the proton in the off-momentum tracker
      pimin_n_hits_b0:   raw hits of the π⁻ in the B0 tracker
      pimin_n_hits_rp:   raw hits of the π⁻ in the Roman Pots
      pimin_n_hits_offm: raw hits of the π⁻ in the off-momentum tracker
      prot_cent:         1 when central tracking reconstructed the proton (ReconstructedChargedParticleAssociations)
      pimin_cent:        1 when central tracking reconstructed the π⁻
      prot_b0trk:        1 when a B0 truth-seeded track belongs to the proton (empty collection in stock campaign files)
      pimin_b0trk:       1 when a B0 truth-seeded track belongs to the π⁻
      prot_rp_dp:        smallest |p − p_true| / p_true of any Roman Pot candidate, -1 without candidates
      prot_offm_dp:      smallest |p − p_true| / p_true of any off-momentum candidate, -1 without candidates
      n_rp:              Roman Pot candidates in the event

  comb_candidates:
    row: one proton or π⁻ candidate
    needs: reco
    links:
      mc_index: mc_particles.prt_index
    columns:
      evt:                 entry number in the input file; joins every file of one input
      cand_source:         source — 0 central tracking, 1 B0 truth-seeded tracks, 2 Roman Pots, 4 off-momentum tracker
      cand_index:          index in the source collection
      cand_charge:         electric charge [e]
      cand_mom_x:          momentum x [GeV/c]
      cand_mom_y:          momentum y [GeV/c]
      cand_mom_z:          momentum z [GeV/c]
      cand_mom:            momentum [GeV/c]
      cand_theta:          polar angle [rad]
      cand_eta:            pseudorapidity
      cand_phi:            azimuthal angle [rad]
      cand_ref_pos_x:      reference point or track position x [mm]
      cand_ref_pos_y:      reference point or track position y [mm]
      cand_ref_pos_z:      reference point or track position z [mm]
      cand_quality:        PID goodness (source 0), track χ² (1), -1 (2, 4)
      cand_ndf:            track degrees of freedom (1), -1 otherwise
      cand_n_measurements: tracks of the particle (0), measurements of the track (1), -1 otherwise
      mc_index:            index of the associated MC particle of largest weight in MCParticles, -1 without association
      mc_weight:           association weight, -1 without association
      mc_pdg:              PDG code of the associated MC particle, 0 without association
      mc_gen_status:       generator status of the associated MC particle, -1 without association
      is_sul_prot:         1 when the label is the proton of the first Λ
      is_sul_pimin:        1 when the label is the π⁻ of the first Λ
      dp_prot:             relative momentum distance to the true proton (sources 2, 4), -1 otherwise
      dth_prot:            angle distance to the true proton (sources 2, 4), -1 otherwise
      dp_pimin:            relative momentum distance to the true π⁻ (sources 2, 4), -1 otherwise
      dth_pimin:           angle distance to the true π⁻ (sources 2, 4), -1 otherwise

  comb_candidates_events:
    row: one event, with the first Λ's truth summary
    needs: reco
    keys: [evt]
    links:
      prot_index: mc_particles.prt_index
      pimin_index: mc_particles.prt_index
    columns:
      evt:             entry number in the input file; joins every file of one input
      n_lambdas:       Λs in MCParticles
      lam_decay:       Λ decay type — 0 no daughters, 1 p π⁻, 2 n π⁰, 3 more than two daughters, 4 only p, 5 only π⁺, 6 only n, 7 only π⁰, 8 other; -1 without a Λ
      prot_index:      index of the first Λ's proton in MCParticles, -1 without one
      pimin_index:     index of the first Λ's π⁻ in MCParticles, -1 without one
      lam_mom:         momentum of the first Λ [GeV/c]
      lam_eta:         pseudorapidity of the first Λ
      lam_phi:         azimuthal angle of the first Λ [rad]
      lam_decay_pos_x: decay point x (the proton's production vertex), 0 without a proton [mm]
      lam_decay_pos_y: decay point y, 0 without a proton [mm]
      lam_decay_pos_z: decay point z, 0 without a proton [mm]
      prot_mom:        momentum of the first Λ's proton [GeV/c]
      prot_theta:      polar angle of the first Λ's proton [rad]
      prot_phi:        azimuthal angle of the first Λ's proton [rad]
      pimin_mom:       momentum of the first Λ's π⁻ [GeV/c]
      pimin_theta:     polar angle of the first Λ's π⁻ [rad]
      pimin_phi:       azimuthal angle of the first Λ's π⁻ [rad]

